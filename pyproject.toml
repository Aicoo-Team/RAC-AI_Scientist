[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rac-ai-scientist"
version = "0.1.0a0"
description = "Matched-budget RAC experiments across AI-scientist host systems"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "RAC AI Scientist contributors"}]
keywords = ["ai-scientist", "multi-agent", "evaluation", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["openai>=1.0,<3"]

[project.urls]
Homepage = "https://github.com/FORLEMON/RAC-AI_Scientist"
Repository = "https://github.com/FORLEMON/RAC-AI_Scientist"
Issues = "https://github.com/FORLEMON/RAC-AI_Scientist/issues"

[project.scripts]
rac-ai-scientist = "rac_ai_scientist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
