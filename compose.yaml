services:
  ark:
    build:
      context: .
      dockerfile: docker/Dockerfile.ark
      additional_contexts:
        host: ${ARK_CONTEXT:-./upstreams/ark}
    environment: &agent_environment
      AGENT_API_BASE: ${AGENT_API_BASE:-}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      AGENT_MODEL_NAME: ${AGENT_MODEL_NAME:-}
      SHAREDNET_BASE_URL: ${SHAREDNET_BASE_URL:-https://www.sharednet.ai}
      SHAREDNET_INVITE: ${SHAREDNET_INVITE:-}
      SHAREDNET_ROOM_ID: ${SHAREDNET_ROOM_ID:-}
      RAC_IMAGE_ID: ${RAC_IMAGE_ID:-}
    volumes: &run_volumes
      # Set CELL_RUN_ROOT to a unique directory for every evaluated cell.  The
      # fallback keeps local diagnostics usable but formal runs must override it.
      - ${CELL_RUN_ROOT:-./runs/current-cell}:/runs
      - ${PREPARED_TASK:-./benchmark_input}:/input/task:ro

  agent-laboratory:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent-laboratory
      additional_contexts:
        host: ${AGENT_LABORATORY_CONTEXT:-./upstreams/agent_laboratory}
    environment: *agent_environment
    volumes: *run_volumes

  evo-scientist:
    build:
      context: .
      dockerfile: docker/Dockerfile.evo-scientist
      additional_contexts:
        host: ${EVO_SCIENTIST_CONTEXT:-./upstreams/evo_scientist}
    environment: *agent_environment
    volumes: *run_volumes

  scorer:
    build:
      context: .
      dockerfile: docker/Dockerfile.scorer
      additional_contexts:
        benchmark: ${RCB_CONTEXT:-./upstreams/researchclawbench}
    environment:
      JUDGE_PROVIDER: ${JUDGE_PROVIDER:-}
      JUDGE_API_BASE: ${JUDGE_API_BASE:-}
      JUDGE_API_KEY: ${JUDGE_API_KEY:-}
      JUDGE_MODEL_NAME: ${JUDGE_MODEL_NAME:-}
      JUDGE_API_VERSION: ${JUDGE_API_VERSION:-2025-04-01-preview}
      JUDGE_MAX_COMPLETION_TOKENS: ${JUDGE_MAX_COMPLETION_TOKENS:-1000}
      JUDGE_MAX_WORKERS: ${JUDGE_MAX_WORKERS:-1}
      SCORER_IMAGE_ID: ${SCORER_IMAGE_ID:-}
    volumes:
      - ${CELL_RUN_ROOT:-./runs/current-cell}:/runs
